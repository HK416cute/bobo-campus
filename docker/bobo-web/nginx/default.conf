# =============================================================================
# bobo 站点配置（子路径部署：站点挂在 /bobo-campus/ 下）
#
# 路由总览：
#   /                       → 302 到 /bobo-campus/
#   /bobo-campus/...        → 前端 SPA（静态资源与前端路由由脚本区分，见下）
#   /bobo-campus/api/**     → 反向代理到后端（剥掉前缀）
#   /bobo-campus/upload/**  → 直接读共享上传卷
#   /api/**、/upload/**     → 保留根路径版本：数据库里的历史图片 URL、容器健康检查、
#                             以及旧前端镜像打的接口都依赖它们，删了会静默坏掉
#   /healthz                → nginx 存活探测
#
# ★ 改这个文件不用重建镜像：compose 把本文件以 :ro 挂进 /etc/nginx/conf.d/default.conf，
#   改完执行 `docker exec <web容器> nginx -t && nginx -s reload` 即可生效。
#
# ★ 站点子路径同时由两处决定，改一处必须改另一处：
#     ① 本文件的 /bobo-campus 前缀
#     ② docker-compose.yml 里 bobo-web.build.args.VITE_BASE（决定前端产物的 base）
#   两处不一致的典型表现：页面能打开但接口全 404，或静态资源 404 导致白屏。
# =============================================================================

upstream bobo_server {
    # 容器名由 docker-compose 的网络别名提供
    server bobo-server:9080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- 入口重定向
    location = / {
        # 用 302 而不是 301：部署路径将来若变化，301 会被浏览器长期缓存，改回来很麻烦
        return 302 /bobo-campus/;
    }

    location = /bobo-campus {
        return 302 /bobo-campus/;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- 后端接口（带前缀）
    location ^~ /bobo-campus/api/ {
        # 剥掉 /bobo-campus 前缀再转发：后端挂在根路径 /api/**，不感知子路径
        rewrite ^/bobo-campus(/api/.*)$ $1 break;
        proxy_pass         http://bobo_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------------------------------------------------------------- 后端接口（根路径，兼容历史）
    location ^~ /api/ {
        proxy_pass         http://bobo_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------------------------------------------------------------- 上传图片（带前缀）
    # 必须 ^~，否则会被下面的静态资源正则先命中，nginx 去站点根找图片 → 404。
    # 挡脚本的规则**嵌套在 ^~ 内部**：^~ 会跳过所有顶层正则，
    # 写在它外面的 deny 规则等于不生效（那是比 404 更严重的安全回归）。
    location ^~ /bobo-campus/upload/ {
        alias /data/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        location ~* \.(?:php|phtml|jsp|jspx|asp|aspx|sh|bash|py|pl|cgi|html?)$ {
            deny all;
        }
    }

    # ---------------------------------------------------------------- 上传图片（根路径，数据库历史 URL）
    location ^~ /upload/ {
        alias /data/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        location ~* \.(?:php|phtml|jsp|jspx|asp|aspx|sh|bash|py|pl|cgi|html?)$ {
            deny all;
        }
    }

    # ---------------------------------------------------------------- 前端 SPA（带前缀）
    # 产物布局：Vite 的 base 只改变 index.html 里**引用资源的前缀**，
    # 文件本身仍落在站点根（/usr/share/nginx/html/index.html、/assets/...），
    # **不会**生成 bobo-campus/ 子目录。因此这里必须用 root + 显式 index.html 回落，
    # 且回落目标写成 /index.html（写成 /bobo-campus/index.html 会因文件不存在
    # 触发内部重定向循环 → 500，本机实测踩过）。
    #
    # 静态资源与前端路由都用这一条规则处理：
    #   · /bobo-campus/assets/x.js → $uri 在 root 下找得到 → 200
    #   · /bobo-campus/admin/ai    → 找不到 → 回落 /index.html → SPA 接管（刷新不白屏）
    # ---------------------------------------------------------------- 站点入口 index.html
    # ★★ 这个精确块是整份配置的关键，缺了它 SPA 会变成 302 死循环。
    #
    # try_files 的每一项（除最后一项）都是**内部重定向**，会重新走一遍 location 匹配。
    # 所以 `try_files $uri $uri/index.html /index.html` 里的 /index.html 会再匹配一次：
    #   · 没有本精确块时，/index.html 落到下面的 `location /` → 302 /bobo-campus/ →
    #     又回到 SPA location → 再 try_files → 无限循环（实测就是"每个请求都 302 到自己"）；
    #   · 有了本精确块，/index.html 直接在这里被终结并返回文件，循环被打断。
    # 顺带在这里声明"入口不缓存"，与本项目原有的缓存策略一致。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------- 前端静态资源（带前缀）
    # 必须用 alias 剥掉 /bobo-campus 前缀，原因：
    #   产物物理位置是 /usr/share/nginx/html/assets/x.js（Vite 的 base 只改引用前缀，
    #   不会生成 bobo-campus 子目录），而 root 模式下 try_files 是「root + 完整 URI」，
    #   会去找 /usr/share/nginx/html/bobo-campus/assets/x.js —— 永远找不到，
    #   于是回落成 index.html，浏览器把 HTML 当 JS 解析（现象：资源 404 或白屏，
    #   但状态码是 200，很难排查）。
    # alias 的语义是「替换掉 location 匹配到的部分」，因此用捕获组把
    # assets/xxx 这一段整体捕获（编号组 $1），拼出的路径才正确。
    location ~* ^/bobo-campus/(assets/.+|img/.+|favicon\.svg|logo\.svg)$ {
        alias /usr/share/nginx/html/$1;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 静态资源找不到就 404，**不能**回落 index.html
    }

    # ---------------------------------------------------------------- 前端 SPA（带前缀）
    # ★ 这里**不能用 ^~**：^~ 命中后会跳过所有顶层正则 location，
    #   把上面的静态资源 alias 规则变成死代码（实测现象：js/svg 全部返回 index.html）。
    #   普通前缀 + 让正则优先（正则默认优先于普通前缀）即可两全。
    #
    # 三项的作用（顺序不能变）：
    #   $uri           —— 命中根路径下的真实文件（少数放在站点根的资源）
    #   $uri/index.html—— 目录请求直接命中文件：/bobo-campus/ → index.html
    #   /index.html    —— 前端路由回落：/bobo-campus/admin/ai → index.html（刷新不白屏）
    location /bobo-campus/ {
        try_files $uri $uri/index.html /index.html;
    }

    # ---------------------------------------------------------------- 兜底
    location / {
        return 302 /bobo-campus/;
    }
}
