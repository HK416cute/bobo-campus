# =============================================================================
# bobo 站点配置
#   /              前端 SPA（history 模式，找不到文件回落到 index.html）
#   /api/**        反向代理到后端容器
#   /upload/**     直接读取共享的上传卷（比走后端转发快，也不占后端线程）
#
# 默认不暴露接口文档（/swagger-ui、/v3/api-docs）。
# 需要在服务器上调试接口时，把 docker-compose 的 nginx 配置挂载换成
# default.with-docs.conf 即可（见 docker/bobo-web/nginx/README.md）。
#
# 踩坑记录：/upload/ 这类**非正则 location 里不能再嵌 location**（嵌套 location
# 只在正则 location 内合法）。第一版就是这么写的，结果 alias 解析被破坏，
# 所有上传的图片全变 404。下面改成把「挡脚本扩展名」的规则上移成同级 location：
# nginx 的匹配顺序是「正则按出现顺序优先、前缀取最长」，所以放在前面的
# 正则 location 会先命中 .php/.sh 这类请求，其余请求才落到 /upload/ 的 alias。
# =============================================================================

upstream bobo_server {
    # 容器名由 docker-compose 的网络别名提供
    server bobo-server:9080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 前端静态资源：带 hash 的文件长缓存，index.html 不缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端接口
    location /api/ {
        proxy_pass         http://bobo_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 图片上传目录（由 compose 挂载到同一路径的卷）。
    #
    # 这里有两个必须同时满足的约束，第三版就是只满足了一个才出问题的：
    #   1) 必须用 ^~：否则上面「前端静态资源」的正则 location 会先命中 .png/.jpg，
    #      nginx 会去 root（/usr/share/nginx/html）找图片 → 全部 404；
    #   2) 挡脚本的规则必须**嵌套在本 location 里**：^~ 的语义是"跳过所有顶层正则"，
    #      写在 /upload/ 外面的那条 deny 正则会被一并跳过，于是 evil.php 变成 200 可下载
    #      （这是比 404 更严重的安全回归）。
    # 嵌套 location 只在两类宿主里合法：正则 location，以及带 ^~ 的前缀 location —— 正是这里。
    location ^~ /upload/ {
        alias /data/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        # 上传目录里只应有图片：脚本 / 可执行扩展名一律拒绝
        location ~* \.(?:php|phtml|jsp|jspx|asp|aspx|sh|bash|py|pl|cgi|html?)$ {
            deny all;
        }
    }

    # SPA 回落：/item/12、/admin/items 这类前端路由都能直达
    location / {
        try_files $uri $uri/ /index.html;
    }
}
