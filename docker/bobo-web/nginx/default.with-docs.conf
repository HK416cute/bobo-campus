# =============================================================================
# 带接口文档的站点配置（仅用于服务器上临时调试）
# 用法（在项目根目录执行）：
#   cp docker/bobo-web/nginx/default.with-docs.conf docs-nginx.conf
#   然后在 docker-compose.yml 的 bobo-web 服务里，把
#     ./docker/bobo-web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
#   改成
#     ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
#   再 docker compose up -d bobo-web
# 调试完记得换回来：接口文档会暴露全部接口结构，不适合长期对外开放。
#
# 说明：本变体与 default.conf 保持同样的 /bobo-campus/ 子路径结构，
# 只是额外把 /swagger-ui/ 与 /v3/api-docs 反代到后端。
# 接口文档路径刻意**不带**子路径（/swagger-ui/），因为 springdoc 生成的
# OpenAPI 文档里写死的服务地址就是根路径；给 swagger 也加前缀需要额外配置
# springdoc 的 server url，调试场景不值得，所以这里按根路径访问：
#   http://<host>/swagger-ui.html
# =============================================================================

upstream bobo_server {
    server bobo-server:9080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 根路径与不带斜杠都跳到站点子路径
    location = / {
        return 302 /bobo-campus/;
    }

    location = /bobo-campus {
        return 302 /bobo-campus/;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带前缀的接口（前端 base 是 /bobo-campus/，请求会带前缀）
    location ^~ /bobo-campus/api/ {
        rewrite ^/bobo-campus(/api/.*)$ $1 break;
        proxy_pass         http://bobo_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 根路径接口：健康检查与历史调用
    location ^~ /api/ {
        proxy_pass         http://bobo_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 接口文档（仅调试用，按根路径访问）
    location /swagger-ui/ {
        proxy_pass http://bobo_server;
    }

    location /v3/api-docs {
        proxy_pass http://bobo_server;
    }

    # 图片上传目录：带前缀与根路径两个版本都要有
    # ^~ 不可省略（否则前端静态资源正则会先命中 .png/.jpg 导致图片 404）；
    # 挡脚本的规则必须嵌套在 ^~ 内部（^~ 会跳过顶层正则，写外面等于不生效）
    location ^~ /bobo-campus/upload/ {
        alias /data/upload/;
        expires 7d;

        location ~* \.(?:php|phtml|jsp|jspx|asp|aspx|sh|bash|py|pl|cgi|html?)$ {
            deny all;
        }
    }

    location ^~ /upload/ {
        alias /data/upload/;
        expires 7d;

        location ~* \.(?:php|phtml|jsp|jspx|asp|aspx|sh|bash|py|pl|cgi|html?)$ {
            deny all;
        }
    }

    # 前端 SPA：回落目标必须是 /index.html（产物在站点根，没有 bobo-campus 子目录，
    # 写成 /bobo-campus/index.html 会导致内部重定向循环 → 500）
    location ^~ /bobo-campus/ {
        try_files $uri $uri/ /index.html;
    }

    # 兜底
    location / {
        return 302 /bobo-campus/;
    }
}
